<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        .email-header {
            background: linear-gradient(135deg, #3D9D9B 0%, #2d7d7b 100%);
            padding: 30px 20px;
            text-align: center;
            color: #ffffff;
        }
        .email-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .email-body {
            padding: 40px 30px;
        }
        .email-body h2 {
            color: #3D9D9B;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .email-body p {
            margin: 15px 0;
            font-size: 15px;
            color: #555555;
        }
        .credentials-box {
            background-color: #f8f9fa;
            border-left: 4px solid #3D9D9B;
            padding: 20px;
            margin: 25px 0;
            border-radius: 4px;
        }
        .credentials-box p {
            margin: 8px 0;
            font-size: 14px;
        }
        .credentials-label {
            font-weight: 600;
            color: #333333;
            display: inline-block;
            min-width: 100px;
        }
        .credentials-value {
            color: #3D9D9B;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        .login-button {
            display: inline-block;
            background-color: #3D9D9B;
            color: #ffffff !important;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .login-button:hover {
            background-color: #2d7d7b;
        }
        .otp-box {
            background-color: #f0f8ff;
            border: 2px dashed #3D9D9B;
            padding: 25px;
            margin: 25px 0;
            text-align: center;
            border-radius: 6px;
        }
        .otp-code {
            font-size: 32px;
            font-weight: 700;
            color: #3D9D9B;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
        }
        .otp-validity {
            font-size: 13px;
            color: #666666;
            margin-top: 10px;
        }
        .email-footer {
            background-color: #f8f9fa;
            padding: 25px 30px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }
        .email-footer p {
            margin: 8px 0;
            font-size: 13px;
            color: #666666;
        }
        .email-footer a {
            color: #3D9D9B;
            text-decoration: none;
        }
        .email-footer a:hover {
            text-decoration: underline;
        }
        .divider {
            height: 1px;
            background-color: #e9ecef;
            margin: 25px 0;
        }
        @media only screen and (max-width: 600px) {
            .email-body {
                padding: 30px 20px;
            }
            .email-header {
                padding: 25px 15px;
            }
            .email-header h1 {
                font-size: 20px;
            }
            .credentials-box {
                padding: 15px;
            }
            .otp-code {
                font-size: 28px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <h1>EstateLink</h1>
        </div>
        
        <!-- Body -->
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        
        <!-- Footer -->
        <div class="email-footer">
            <p><strong>EstateLink</strong></p>
            <p>Your trusted property management solution</p>
            <div class="divider"></div>
            <p style="font-size: 12px; color: #999999;">
                This is an automated email. Please do not reply to this message.<br>
                If you have any questions, please contact your property management team.
            </p>
            <p style="font-size: 12px; color: #999999; margin-top: 15px;">
                © {% now "Y" %} EstateLink. All rights reserved.
            </p>
        </div>
    </div>
</body>
</html>
